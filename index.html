<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTA - Calculator Trader Assistance</title>

    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <div class="wrapper">

        <h1>Calculator Trader Assistance</h1>

        <div class="container">

            <div class="card">

                <p class="title">Position Size Calculator</p>

                <label>Risk Amount ($)</label>
                <input id="risk" type="number" placeholder="100">

                <label>Stop Loss (Pips)</label>
                <input id="stop" type="number" placeholder="5">

                <label>Risk Reward (RR)</label>
                <input id="rr" type="number" value="2">

                <div id="sizeResult" class="result"></div>
                <div id="profitResult" class="result"></div>

            </div>

            <div class="card">

                <p class="title">Risk Percent Calculator</p>

                <label>Account Balance ($)</label>
                <input id="margin" type="number" placeholder="10000">

                <label>Risk Percent (%)</label>
                <input id="percent" type="number" value="2">

                <div id="riskResult" class="result"></div>

            </div>

        </div>

    </div>

</body>
</html>
