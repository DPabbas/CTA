<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTA - Calculator Trader Assistance</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">

        <h1>Calculator Trader Assistance</h1>

        <div class="container">

            <div class="card">

                <h2>Forex Position Size Calculator</h2>

                <label for="risk">Risk Amount ($)</label>
                <input id="risk" type="number" value="100">

                <label for="stop">Stop Loss (Pips)</label>
                <input id="stop" type="number" value="2">

                <label for="rr">Risk Reward (RR)</label>
                <input id="rr" type="number" value="2">

                <div id="sizeResult" class="result"></div>
                <div id="profitResult" class="result"></div>

            </div>

            <div class="card">

                <h2>Risk Percent Calculator</h2>

                <label for="margin">Account Balance ($)</label>
                <input id="margin" type="number" value="10000">

                <label for="percent">Risk Percent (%)</label>
                <input id="percent" type="number" value="2">

                <div id="riskResult" class="result"></div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
